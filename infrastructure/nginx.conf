# Docker's service address can change when only the API container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream tianyan_api {
    zone tianyan_api 64k;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Independent of the API and database. Expose only the single sanitized file.
    location = /maintenance/status.json {
        alias /workspace/maintenance-status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location /maintenance/ {
        try_files $uri $uri/ =404;
        expires -1;
        access_log off;
    }
    # Model probes are bounded by the gateway's 180-second absolute deadline.
    location ~ ^/api/v1/chatgpt/ {
        proxy_pass http://tianyan_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/api/v1/integrations/(probe|discover-models)$ {
        proxy_pass http://tianyan_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        access_log off;
    }
    # Bounded 60-session historical arithmetic can exceed the live-read limit.
    location = /api/v1/review-data/series {
        proxy_pass http://tianyan_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        access_log off;
    }
    location = /api/v1/workbench-updates {
        proxy_pass http://tianyan_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        access_log off;
    }
    location /api/ {
        proxy_pass http://tianyan_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        access_log off;
    }
    location /health/ {
        proxy_pass http://tianyan_api;
        access_log off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
